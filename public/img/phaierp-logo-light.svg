<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PhaiERP mark for dark backgrounds (sidebar, login panel): a white ring around one bamboo culm leaning in the wind,
       square-cut, with its nodes and slender pointed leaves, in light mint. phaierp-logo.svg is the green one for light backgrounds. -->
  <defs>
    <linearGradient id="culm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2fff8"/><stop offset="1" stop-color="#b6ead0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#fff" stroke-width="1.6"/>
  <g transform="translate(32 32) scale(.78) translate(-32 -32)">
    <g transform="translate(64 0) scale(-1 1)">
      <rect x="28" y="6" width="8" height="54" fill="url(#culm)" transform="rotate(12 32 32)"/>
      <g stroke="#0e5c41" stroke-opacity=".75" stroke-width="2.2" transform="rotate(12 32 32)"><path d="M28 22h8M28 38h8"/></g>
      <g fill="#d4f7e5">
        <path d="M38 22C45 14 53 11 61 12C55 18 47 22 38 22Z"/>
        <path d="M38 22C45 22 52 25 57 30C50 31 43 28 38 22Z" fill-opacity=".85"/>
        <path d="M27 40C20 35 12 35 4 38C11 43 19 44 27 40Z" fill-opacity=".92"/>
      </g>
    </g>
  </g>
</svg>
